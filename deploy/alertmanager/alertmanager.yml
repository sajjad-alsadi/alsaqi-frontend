# =============================================================================
# Alertmanager Configuration — AL-SAQI Alert Routing
# =============================================================================
# Routes alerts from Prometheus to configured notification receivers.
# Default: webhook receiver. Configure email/Slack as needed.

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default-webhook

  routes:
    # Critical alerts — shorter repeat interval
    - match:
        severity: critical
      receiver: default-webhook
      repeat_interval: 1h

    # Warning alerts — standard repeat interval
    - match:
        severity: warning
      receiver: default-webhook
      repeat_interval: 4h

receivers:
  - name: default-webhook
    webhook_configs:
      - url: 'http://api:3000/api/webhooks/alerts'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']

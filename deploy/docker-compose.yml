# =============================================================================
# AL-SAQI Production Docker Compose
# =============================================================================
# Orchestrates Nginx (reverse proxy with TLS) + API (Express.js) + Web (static
# frontend) as independent services with no inter-service dependencies.
#
# Usage:
#   1. Copy .env.example to .env and configure all required variables
#   2. Place SSL certificates in ./ssl/ directory
#   3. Set SERVER_NAME in .env (used by nginx template via envsubst)
#   4. Run: docker compose up -d
#
# Prerequisites:
#   - Docker Engine 20.10+
#   - Docker Compose v2
#   - SSL certificates (self-signed for testing, Let's Encrypt for production)
#
# Independent Deployment:
#   - API and Web services have NO depends_on between them
#   - Each can be deployed, restarted, or scaled independently
#   - Nginx handles routing: /api → api container, everything else → web container
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: alsaqi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SERVER_NAME=${SERVER_NAME:-localhost}
    volumes:
      - ./ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # AL-SAQI API Server (packages/api)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../
      dockerfile: packages/api/Dockerfile
    container_name: alsaqi-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - FILE_ENCRYPTION_KEY=${FILE_ENCRYPTION_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://your-domain.example.com}
      - DB_SSL_REJECT_UNAUTHORIZED=${DB_SSL_REJECT_UNAUTHORIZED:-true}
      - DB_SSL_CA_PATH=${DB_SSL_CA_PATH:-}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_DIR=/app/backups
      - ENCRYPT_BACKUPS=${ENCRYPT_BACKUPS:-true}
      - AUDIT_TRAIL_RETENTION_MONTHS=${AUDIT_TRAIL_RETENTION_MONTHS:-24}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads
      - app-backups:/app/backups
      - app-logs:/app/logs
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MinIO Object Storage (S3-compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: alsaqi-minio
    restart: unless-stopped
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis (Message Broker for BullMQ)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alsaqi-redis
    restart: unless-stopped
    expose:
      - "6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # AL-SAQI Web Frontend (apps/web)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    container_name: alsaqi-web
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Prometheus — Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: alsaqi-prometheus
    restart: unless-stopped
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - alsaqi-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'

  # ---------------------------------------------------------------------------
  # Grafana — Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: alsaqi-grafana
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - alsaqi-network

  # ---------------------------------------------------------------------------
  # Loki — Log Aggregation
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:2.9.6
    container_name: alsaqi-loki
    restart: unless-stopped
    expose:
      - "3100"
    volumes:
      - loki-data:/loki
    networks:
      - alsaqi-network

  # ---------------------------------------------------------------------------
  # Promtail — Log Shipping
  # ---------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:2.9.6
    container_name: alsaqi-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - app-logs:/var/log/alsaqi:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - alsaqi-network

  # ---------------------------------------------------------------------------
  # Alertmanager — Alert Routing
  # ---------------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alsaqi-alertmanager
    restart: unless-stopped
    expose:
      - "9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks:
      - alsaqi-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  app-data:
    driver: local
  app-uploads:
    driver: local
  app-backups:
    driver: local
  app-logs:
    driver: local
  certbot-webroot:
    driver: local
  minio-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  alsaqi-network:
    driver: bridge

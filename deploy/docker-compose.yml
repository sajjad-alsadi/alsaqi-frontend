# =============================================================================
# AL-SAQI Production Docker Compose
# =============================================================================
# Orchestrates Nginx (reverse proxy with TLS) + API (Express.js) + Web (static
# frontend) as independent services with no inter-service dependencies.
#
# Usage:
#   1. Copy .env.example to .env and configure all required variables
#   2. Place SSL certificates in ./ssl/ directory
#   3. Copy nginx.conf.example to nginx/nginx.conf and adjust server_name
#   4. Run: docker compose up -d
#
# Prerequisites:
#   - Docker Engine 20.10+
#   - Docker Compose v2
#   - SSL certificates (self-signed for testing, Let's Encrypt for production)
#
# Independent Deployment:
#   - API and Web services have NO depends_on between them
#   - Each can be deployed, restarted, or scaled independently
#   - Nginx handles routing: /api → api container, everything else → web container
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Nginx Reverse Proxy
  # ---------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: alsaqi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.example:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot-webroot:/var/www/certbot:ro
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # AL-SAQI API Server (packages/api)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ../
      dockerfile: packages/api/Dockerfile
    container_name: alsaqi-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:-}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY:-}
      - FILE_ENCRYPTION_KEY=${FILE_ENCRYPTION_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://your-domain.example.com}
      - DB_SSL_REJECT_UNAUTHORIZED=${DB_SSL_REJECT_UNAUTHORIZED:-true}
      - DB_SSL_CA_PATH=${DB_SSL_CA_PATH:-}
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-30}
      - BACKUP_DIR=/app/backups
      - ENCRYPT_BACKUPS=${ENCRYPT_BACKUPS:-true}
      - AUDIT_TRAIL_RETENTION_MONTHS=${AUDIT_TRAIL_RETENTION_MONTHS:-24}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - app-data:/app/data
      - app-uploads:/app/uploads
      - app-backups:/app/backups
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MinIO Object Storage (S3-compatible)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: alsaqi-minio
    restart: unless-stopped
    ports:
      - "9000:9000"    # S3 API
      - "9001:9001"    # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Redis (Message Broker for BullMQ)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: alsaqi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass}
    volumes:
      - redis-data:/data
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # AL-SAQI Web Frontend (apps/web)
  # ---------------------------------------------------------------------------
  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
    container_name: alsaqi-web
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - NODE_ENV=production
    networks:
      - alsaqi-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  app-data:
    driver: local
  app-uploads:
    driver: local
  app-backups:
    driver: local
  certbot-webroot:
    driver: local
  minio-data:
    driver: local
  redis-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  alsaqi-network:
    driver: bridge

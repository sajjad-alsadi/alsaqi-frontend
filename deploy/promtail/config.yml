# =============================================================================
# Promtail Configuration — AL-SAQI Log Shipping
# =============================================================================
# Scrapes application logs from /var/log/alsaqi (mounted from app-logs volume)
# and Docker container logs via the Docker socket.
# Ships all logs to Loki for centralized aggregation.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # -------------------------------------------------------------------------
  # Application logs from /var/log/alsaqi (API server file transports)
  # -------------------------------------------------------------------------
  - job_name: alsaqi-app-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: alsaqi-api
          environment: production
          __path__: /var/log/alsaqi/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            correlationId: correlationId
            timestamp: timestamp
      - labels:
          level:
          service:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05"

  # -------------------------------------------------------------------------
  # Docker container logs via Docker socket
  # -------------------------------------------------------------------------
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values:
              - "com.docker.compose.project=deploy"

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service

    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            msg: message
      - labels:
          level:

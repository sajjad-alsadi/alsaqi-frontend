# =============================================================================
# GitLab CI/CD Pipeline - نظام الساقي (AL-SAQI)
# =============================================================================
# خط أنابيب CI/CD المؤتمت لنظام إدارة التدقيق الداخلي
# Automated CI/CD pipeline for the internal audit management system
#
# المراحل (Stages):
#   1. validate        - التحقق من جودة الكود (Lint, TypeCheck, Security Audit)
#   2. test            - تشغيل الاختبارات مع تقرير التغطية (Unit Tests + Coverage)
#   3. build           - بناء صورة Docker ووسمها (Docker Image Build & Tag)
#   4. deploy          - النشر اليدوي لبيئة الإنتاج (Manual Production Deployment)
#   5. smoke-load-test - اختبار تحميل دخاني بعد النشر (Smoke Load Test after Deploy)
#
# ملاحظات:
#   - يفشل الخط إذا فشلت مرحلة validate أو test
#   - مرحلة build تعمل فقط على فرع main
#   - مرحلة deploy تتطلب تشغيل يدوي (manual trigger)
#   - يتم تخزين node_modules مؤقتاً لتسريع التنفيذ
# =============================================================================

# الصورة الأساسية - Node.js 20 Alpine لجميع المهام
# Base image - Node.js 20 Alpine for all jobs
image: node:20-alpine

# تعريف المراحل بالترتيب
# Define pipeline stages in order
stages:
  - validate
  - test
  - build
  - deploy
  - smoke-load-test

# =============================================================================
# التخزين المؤقت (Caching)
# تخزين node_modules بين عمليات التشغيل لتحسين الأداء
# Cache node_modules between pipeline runs for performance optimization
# المفتاح مبني على hash ملف package-lock.json لإعادة البناء عند تغيير التبعيات
# Key is based on package-lock.json hash to rebuild when dependencies change
# =============================================================================
cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull-push

# =============================================================================
# متغيرات عامة (Global Variables)
# =============================================================================
variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# تثبيت التبعيات قبل كل مهمة (إذا لم تكن مخزنة مؤقتاً)
# Install dependencies before each job (if not cached)
before_script:
  - npm ci --prefer-offline

# =============================================================================
# مرحلة التحقق (Validate Stage)
# التحقق من جودة الكود، الأنماط، والأمان
# Code quality, formatting, and security validation
# =============================================================================

# مهمة الفحص (Lint Job)
# تشغيل ESLint للتحقق من جودة الكود و Prettier للتحقق من التنسيق
# Run ESLint for code quality and Prettier for formatting checks
lint:
  stage: validate
  script:
    - npm run lint
    - npx prettier --check .
  rules:
    - when: always

# مهمة فحص الأنواع (TypeCheck Job)
# التحقق من صحة أنواع TypeScript بدون إنشاء ملفات الإخراج
# Verify TypeScript types without emitting output files
typecheck:
  stage: validate
  script:
    - npx tsc --noEmit
  rules:
    - when: always

# مهمة فحص الأمان (Security Audit Job)
# فحص التبعيات بحثاً عن ثغرات أمنية معروفة
# Scan dependencies for known security vulnerabilities
# allow_failure: true — لا يوقف الخط لكن يُظهر تحذيراً
# allow_failure: true — doesn't block pipeline but shows warning
audit:
  stage: validate
  script:
    - npm audit --audit-level=moderate
  allow_failure: true
  rules:
    - when: always

# =============================================================================
# مرحلة الاختبار (Test Stage)
# تشغيل مجموعة الاختبارات الكاملة مع تقرير التغطية
# Run full test suite with coverage reporting
# =============================================================================

# مهمة الاختبار (Test Job)
# تشغيل Vitest مع تغطية الكود وإنشاء تقرير Cobertura
# Run Vitest with code coverage and generate Cobertura report
test:
  stage: test
  script:
    - npx vitest --run --coverage
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - when: always

# =============================================================================
# مرحلة البناء (Build Stage)
# بناء صورة Docker ووسمها بـ commit SHA و latest
# Build Docker image and tag with commit SHA and latest
# تعمل فقط على فرع main
# Only runs on main branch
# =============================================================================

# مهمة بناء Docker (Docker Build Job)
# استخدام Docker-in-Docker لبناء الصورة داخل الحاوية
# Uses Docker-in-Docker (dind) service to build image inside container
build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - docker build -t alsaqi:$CI_COMMIT_SHA .
    - docker tag alsaqi:$CI_COMMIT_SHA alsaqi:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# =============================================================================
# مرحلة النشر (Deploy Stage)
# النشر اليدوي لبيئة الإنتاج — يتطلب تأكيد يدوي من المستخدم
# Manual production deployment — requires manual user confirmation
# تعمل فقط على فرع main
# Only runs on main branch
#
# المتغيرات المحمية المطلوبة (Required Protected CI/CD Variables):
#   - CI_REGISTRY / CI_REGISTRY_USER / CI_REGISTRY_PASSWORD
#   - DEPLOY_SSH_PRIVATE_KEY (SSH key, masked)
#   - DEPLOY_SSH_KNOWN_HOSTS
#   - DEPLOY_USER / DEPLOY_HOST
# =============================================================================

# مهمة النشر (Deploy Job)
# بناء صورة Docker ودفعها إلى السجل، ثم النشر عبر SSH مع فحص الصحة
# Build & push Docker image to registry, deploy via SSH, and verify health
deploy:
  stage: deploy
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    # دفع الصورة إلى السجل (Push image to registry)
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" .
    - docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA" "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    # النشر عبر SSH (Deploy via SSH)
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh && echo "$DEPLOY_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        cd /opt/alsaqi &&
        docker compose pull &&
        docker compose up -d
      "
    # فحص صحة الخدمة (Health check — polls /api/health for 60s)
    - |
      for i in $(seq 1 12); do
        if wget --spider --quiet "http://$DEPLOY_HOST/api/health" 2>/dev/null; then
          echo "Health check passed"
          exit 0
        fi
        echo "Waiting for health... attempt $i/12"
        sleep 5
      done
      echo "Health check failed after 60 seconds"
      exit 1
  environment:
    name: production
  when: manual
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# =============================================================================
# مرحلة اختبار التحميل الدخاني (Smoke Load Test Stage)
# تشغيل اختبار تحميل خفيف بعد النشر للتحقق من الأداء
# Run a lightweight load test after deploy to verify performance baselines
# يفشل الخط إذا تجاوزت النتائج الحدود المحددة
# Fails the pipeline if k6 thresholds are breached
#
# الحدود (Thresholds):
#   - p95 response time < 500ms
#   - Error rate < 1%
#   - Throughput > 100 rps
#
# المتغيرات المطلوبة (Required Variables):
#   - DEPLOY_HOST (from deploy stage)
#   - LOAD_TEST_USER / LOAD_TEST_PASS (protected CI/CD variables)
# =============================================================================

# مهمة اختبار التحميل الدخاني (Smoke Load Test Job)
# تشغيل سيناريو smoke من k6 (10 مستخدمين / 30 ثانية) بعد نجاح النشر
# Run k6 smoke scenario (10 VUs / 30s) after successful deploy
smoke-load-test:
  stage: smoke-load-test
  image: grafana/k6:latest
  before_script: []
  script:
    - k6 run --env BASE_URL=http://$DEPLOY_HOST --env TEST_USER=$LOAD_TEST_USER --env TEST_PASS=$LOAD_TEST_PASS tests/load/api-load-test.js --tag type:smoke
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

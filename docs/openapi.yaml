openapi: '3.1.0'
info:
  title: AL-SAQI Internal Audit System API
  version: '1.0.0'
  description: >
    REST API for the AL-SAQI internal audit management system.
    Handles audit planning, findings, recommendations, risk management,
    correspondence, compliance, and user management.
servers:
  - url: /api
    description: Main API server

security:
  - BearerAuth: []
    CsrfToken: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT token passed via httpOnly cookie or Authorization header
    CsrfToken:
      type: apiKey
      in: header
      name: x-csrf-token
      description: CSRF token required for state-changing requests (POST, PUT, PATCH, DELETE)

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        success:
          type: boolean

    Success:
      type: object
      properties:
        success:
          type: boolean
          example: true

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [Admin, Internal Auditor, Compliance Officer, Risk Officer, Manager, Viewer]
        department:
          type: string
          nullable: true
        job_title_id:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        status:
          type: string
          enum: [Active, Suspended, Archived]
        phone_number:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    AuditPlan:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plan_code:
          type: string
        program_id:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
        department:
          type: string
        type:
          type: string
        risk_rating:
          type: string
        planned_start_date:
          type: string
          format: date
        planned_end_date:
          type: string
          format: date
        status:
          type: string
        lead_auditor:
          type: string
          nullable: true
        team_members:
          type: string
          nullable: true
        objectives:
          type: string
          nullable: true
        scope:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true

    AuditProgram:
      type: object
      properties:
        id:
          type: string
          format: uuid
        program_code:
          type: string
        program_title:
          type: string
        audit_area:
          type: string
        department:
          type: string
        audit_type:
          type: string
        audit_objective:
          type: string
          nullable: true
        audit_scope:
          type: string
          nullable: true
        key_risks:
          type: string
          nullable: true
        status:
          type: string
        version_number:
          type: string
          nullable: true
        created_by:
          type: string
          nullable: true

    Finding:
      type: object
      properties:
        id:
          type: string
          format: uuid
        audit_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        finding_number:
          type: string
        finding_type:
          type: string
        risk_level:
          type: string
        status:
          type: string
        criteria:
          type: string
          nullable: true
        condition:
          type: string
          nullable: true
        cause:
          type: string
          nullable: true
        consequence:
          type: string
          nullable: true
        recommendation:
          type: string
          nullable: true

    Recommendation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        finding_id:
          type: string
          format: uuid
        department:
          type: string
          nullable: true
        responsible:
          type: string
          nullable: true
        responsible_person_id:
          type: string
          format: uuid
          nullable: true
        due_date:
          type: string
          format: date
          nullable: true
        status:
          type: string
        risk_level:
          type: string
          nullable: true
        rec_number:
          type: string
          nullable: true
        action_plan:
          type: string
          nullable: true
        priority:
          type: string
          nullable: true
        closure_evidence_path:
          type: string
          nullable: true

    RiskItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        risk_id:
          type: string
        description:
          type: string
        owner:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        type:
          type: string
          nullable: true
        likelihood:
          type: string
          nullable: true
        impact:
          type: string
          nullable: true
        score:
          type: number
          nullable: true
        rating:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        controls:
          type: string
          nullable: true
        mitigation:
          type: string
          nullable: true

    Correspondence:
      type: object
      properties:
        id:
          type: string
          format: uuid
        letter_number:
          type: string
        sender_entity:
          type: string
        subject:
          type: string
        letter_date:
          type: string
          format: date
        receipt_date:
          type: string
          format: date
        classification:
          type: string
          nullable: true
        priority:
          type: string
          nullable: true
        method:
          type: string
          nullable: true
        status:
          type: string
          nullable: true
        follow_up_required:
          type: boolean
        notes:
          type: string
          nullable: true

    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer

paths:
  /health:
    get:
      summary: Health check
      security: []
      tags: [System]
      responses:
        '200':
          description: Server health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  timestamp:
                    type: string
                  database:
                    type: string
                  persistence:
                    type: string

  /auth/login:
    post:
      summary: User login
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernameOrEmail, password]
              properties:
                usernameOrEmail:
                  type: string
                password:
                  type: string
                rememberMe:
                  type: boolean
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  token:
                    type: string
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      summary: Get current user info
      tags: [Auth]
      responses:
        '200':
          description: Current user with permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'

  /auth/refresh:
    post:
      summary: Refresh access token
      security: []
      tags: [Auth]
      responses:
        '200':
          description: Token refreshed
        '401':
          description: No valid refresh token

  /auth/logout:
    post:
      summary: Logout current session
      tags: [Auth]
      responses:
        '200':
          description: Logged out successfully

  /auth/logout-all:
    post:
      summary: Invalidate all active sessions
      tags: [Auth]
      responses:
        '200':
          description: All sessions invalidated

  /auth/forgot-password:
    post:
      summary: Request password reset
      security: []
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
      responses:
        '200':
          description: Reset request submitted

  /auth/reset-status/{username}:
    get:
      summary: Check password reset status
      security: []
      tags: [Auth]
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reset status

  /auth/reset-requests:
    get:
      summary: Get pending reset requests (Admin)
      tags: [Auth]
      responses:
        '200':
          description: List of reset requests

  /auth/approve-reset:
    post:
      summary: Approve a password reset request (Admin)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId:
                  type: string
      responses:
        '200':
          description: Reset approved

  /auth/change-password:
    post:
      summary: Change password (mandatory or voluntary)
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
      responses:
        '200':
          description: Password changed

  /auth/update-password:
    post:
      summary: Update password with current password verification
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password updated

  /users:
    get:
      summary: List users
      tags: [Users]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated user list
    post:
      summary: Create a new user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User created

  /users/init:
    get:
      summary: Get user initialization data (roles, departments, etc.)
      tags: [Users]
      responses:
        '200':
          description: Init data for user forms

  /users/summary:
    get:
      summary: Get user summary statistics
      tags: [Users]
      responses:
        '200':
          description: User summary

  /users/list:
    get:
      summary: Get active users list (simplified)
      tags: [Users]
      responses:
        '200':
          description: Active users

  /users/{id}:
    get:
      summary: Get user by ID
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
    put:
      summary: Update user
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: User updated
    delete:
      summary: Delete user
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted

  /users/{id}/suspend:
    post:
      summary: Toggle user suspension
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status toggled

  /users/{id}/archive:
    post:
      summary: Archive user
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User archived

  /users/{id}/activate:
    post:
      summary: Activate user
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User activated

  /users/{id}/unlock:
    post:
      summary: Unlock user account
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User unlocked

  /users/{id}/reset-password:
    post:
      summary: Reset user password (Admin)
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword:
                  type: string
      responses:
        '200':
          description: Password reset

  /roles:
    get:
      summary: Get all roles with permissions
      tags: [Roles]
      responses:
        '200':
          description: Roles list

  /roles/{id}/permissions:
    get:
      summary: Get permissions for a role
      tags: [Roles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Role permissions
    post:
      summary: Update role permissions
      tags: [Roles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissionIds]
              properties:
                permissionIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Permissions updated

  /permissions:
    get:
      summary: Get all permissions
      tags: [Roles]
      responses:
        '200':
          description: Permissions list

  /user-sessions:
    get:
      summary: Get active sessions (Admin)
      tags: [Sessions]
      responses:
        '200':
          description: Active sessions list

  /user-sessions/{id}:
    delete:
      summary: Terminate a session (Admin)
      tags: [Sessions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session terminated

  /login-history:
    get:
      summary: Get login history (Admin)
      tags: [Logs]
      responses:
        '200':
          description: Login history

  /audit-trail:
    get:
      summary: Get audit trail (Admin)
      tags: [Logs]
      responses:
        '200':
          description: Audit trail

  /system-errors:
    get:
      summary: Get system errors (Admin)
      tags: [Logs]
      responses:
        '200':
          description: System errors list
    post:
      summary: Log a system error
      security: []
      tags: [Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message, module]
              properties:
                message:
                  type: string
                stack:
                  type: string
                module:
                  type: string
                severity:
                  type: string
      responses:
        '200':
          description: Error logged
    delete:
      summary: Clear all system errors (Admin)
      tags: [Logs]
      responses:
        '200':
          description: Errors cleared

  /system-errors/export:
    get:
      summary: Export system errors as CSV (Admin)
      tags: [Logs]
      responses:
        '200':
          description: CSV file
          content:
            text/csv:
              schema:
                type: string

  /system-errors/analytics:
    get:
      summary: Get system error analytics (Admin)
      tags: [Logs]
      responses:
        '200':
          description: Error analytics

  /log-error:
    post:
      summary: Log a frontend error
      security: []
      tags: [Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message:
                  type: string
                stack:
                  type: string
                module:
                  type: string
      responses:
        '200':
          description: Error logged

  /user-management-settings:
    get:
      summary: Get user management settings (Admin)
      tags: [Settings]
      responses:
        '200':
          description: Settings object
    put:
      summary: Update user management settings (Admin)
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                failed_login_threshold:
                  type: integer
                session_timeout_minutes:
                  type: integer
                password_min_length:
                  type: integer
      responses:
        '200':
          description: Settings updated

  /pdf-settings:
    get:
      summary: Get PDF settings
      tags: [Settings]
      responses:
        '200':
          description: PDF settings
    put:
      summary: Update PDF settings (Admin)
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: PDF settings updated

  /app-settings:
    get:
      summary: Get application settings
      tags: [Settings]
      responses:
        '200':
          description: App settings
    put:
      summary: Update application settings (Admin)
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: App settings updated

  /profile:
    get:
      summary: Get current user profile
      tags: [Profile]
      responses:
        '200':
          description: User profile
    put:
      summary: Update current user profile
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Profile updated

  /preferences:
    put:
      summary: Update user preferences
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                language:
                  type: string
                theme:
                  type: string
                dashboard_layout:
                  type: string
      responses:
        '200':
          description: Preferences updated

  /dashboard-stats:
    get:
      summary: Get dashboard statistics
      tags: [Dashboard]
      parameters:
        - name: department
          in: query
          schema:
            type: string
        - name: riskLevel
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Dashboard stats

  /my-tasks:
    get:
      summary: Get current user tasks
      tags: [Dashboard]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: User tasks list

  /notifications:
    get:
      summary: Get notifications
      tags: [Notifications]
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: pageSize
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Paginated notifications

  /notifications/unread-count:
    get:
      summary: Get unread notification count
      tags: [Notifications]
      responses:
        '200':
          description: Unread count

  /notifications/{id}/read:
    put:
      summary: Mark notification as read
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Marked as read

  /notifications/mark-all-read:
    put:
      summary: Mark all notifications as read
      tags: [Notifications]
      responses:
        '200':
          description: All marked as read

  /notifications/{id}:
    delete:
      summary: Dismiss a notification
      tags: [Notifications]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification dismissed

  /comments/{type}/{id}:
    get:
      summary: Get comments for an entity
      tags: [Comments]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comments list

  /comments:
    post:
      summary: Create a comment
      tags: [Comments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [related_type, related_id, content]
              properties:
                related_type:
                  type: string
                related_id:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Comment created

  /job-titles:
    get:
      summary: Get all job titles
      tags: [JobTitles]
      responses:
        '200':
          description: Job titles list
    post:
      summary: Create a job title (Admin)
      tags: [JobTitles]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title_ar]
              properties:
                title_ar:
                  type: string
                title_en:
                  type: string
                level:
                  type: string
      responses:
        '200':
          description: Job title created

  /job-titles/{id}:
    put:
      summary: Update a job title (Admin)
      tags: [JobTitles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job title updated
    delete:
      summary: Delete a job title (Admin)
      tags: [JobTitles]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Job title deleted

  /departments:
    get:
      summary: Get all departments
      tags: [Departments]
      responses:
        '200':
          description: Departments list
    post:
      summary: Create a department (Admin)
      tags: [Departments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Department created

  /departments/tree:
    get:
      summary: Get department tree structure
      tags: [Departments]
      responses:
        '200':
          description: Department tree

  /departments/{id}:
    put:
      summary: Update a department (Admin)
      tags: [Departments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Department updated
    delete:
      summary: Delete a department (Admin)
      tags: [Departments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Department deleted

  /correspondence/incoming:
    get:
      summary: Get incoming correspondence
      tags: [Correspondence]
      responses:
        '200':
          description: Incoming letters list
    post:
      summary: Create incoming correspondence
      tags: [Correspondence]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Correspondence'
      responses:
        '200':
          description: Letter created

  /correspondence/incoming/{id}:
    put:
      summary: Update incoming correspondence (Admin)
      tags: [Correspondence]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Letter updated
    delete:
      summary: Delete incoming correspondence (Admin)
      tags: [Correspondence]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:

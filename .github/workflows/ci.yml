name: CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so the packages/shared freeze guard can diff against the
          # PR base ref (origin/<base>) rather than a shallow single commit.
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Shared package freeze guard (FIX-FE-1, req 1.2)
        # Fails if any line under packages/shared changed while no Unified_Source
        # decision is agreed. Exemptions are documented in scripts/check-shared-freeze.mjs:
        #   - Unified_Source agreed: SHARED_UNIFIED_SOURCE_AGREED=true or
        #     .kiro/approvals/unified-source.json
        #   - FIX-FE-3 relocation under recorded backend approval: FIX_FE3_BACKEND_APPROVAL=true
        #     or .kiro/approvals/fix-fe-3-backend-approval.json (limited to the relocation paths)
        run: npm run check:shared-freeze

      - name: Typecheck
        run: npm run typecheck --workspace=@alsaqi/web

      - name: Lint
        run: npm run lint --workspace=@alsaqi/web

      - name: Test with coverage
        run: npm run test --workspace=@alsaqi/web -- --coverage
        # Vitest is configured with coverage thresholds (70% line coverage minimum).
        # If coverage falls below 70%, Vitest exits with non-zero code and reports
        # the current coverage percentage. This step will fail and block the merge.

      - name: Report coverage summary
        if: always()
        run: |
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          if [ -f apps/web/coverage/coverage-final.json ]; then
            # Extract and report overall line coverage percentage
            node -e "
              const fs = require('fs');
              const coverage = JSON.parse(fs.readFileSync('apps/web/coverage/coverage-final.json', 'utf8'));
              let totalLines = 0;
              let coveredLines = 0;
              for (const file of Object.values(coverage)) {
                const s = file.s || {};
                const stmtMap = file.statementMap || {};
                for (const [key, count] of Object.entries(s)) {
                  totalLines++;
                  if (count > 0) coveredLines++;
                }
              }
              const pct = totalLines > 0 ? ((coveredLines / totalLines) * 100).toFixed(2) : '0.00';
              const status = parseFloat(pct) >= 70 ? '✅' : '❌';
              console.log(status + ' Overall statement coverage: ' + pct + '%');
              console.log('Threshold: 70% line coverage minimum');
              if (parseFloat(pct) < 70) {
                console.log('⚠️  Coverage is below the 70% threshold. Build will fail.');
              }
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Coverage report not found." >> $GITHUB_STEP_SUMMARY
          fi
